# Builds, tests and (when the version number goes up) signs and publishes Plate.
#
# To release: bump versionCode/versionName in app/build.gradle.kts, write what's new in
# release/next-notes.md (one "- " line each), and push to main. The signing key lives
# only in this repository's encrypted Actions secrets.
name: Build and release Plate

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "release/next-notes.md"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plate-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Is this a new version?
        id: v
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          published=$(python3 -c "import json; print(json.load(open('release/latest.json'))['versionCode'])")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt "$published" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing Plate $name (versionCode $code; published is $published)."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "versionCode $code is not above the published $published: tests only, no release."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Set up the signing key
        if: steps.v.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.PLATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLATE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLATE_KEY_PASSWORD }}
        run: |
          # Plate's key uses one password for the store and the key, so PLATE_KEY_PASSWORD is optional.
          KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. Add PLATE_KEYSTORE_BASE64, PLATE_STORE_PASSWORD and PLATE_KEY_ALIAS in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/plate.keystore"
          {
            echo "plate.keystore=$RUNNER_TEMP/plate.keystore"
            echo "plate.storePassword=$STORE_PASSWORD"
            echo "plate.keyAlias=$KEY_ALIAS"
            echo "plate.keyPassword=$KEY_PASSWORD"
          } > local.properties

      - name: Build the release APK
        if: steps.v.outputs.release == 'true'
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign with key rotation (installs over pre-2.0 versions)
        if: steps.v.outputs.release == 'true'
        env:
          OLD_KEYSTORE_B64: ${{ secrets.PLATE_OLD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLATE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLATE_KEY_PASSWORD }}
        run: |
          # Plate moved from its original key to its release key in 2.0.1. Signing with both keys
          # and release/plate.lineage lets Android 9+ accept the new key as the old key's successor,
          # and Android 8 keep seeing the old key, so every older install can update in place.
          if [ -z "$OLD_KEYSTORE_B64" ]; then
            echo "::error::PLATE_OLD_KEYSTORE_BASE64 is missing, so this build couldn't install over older versions of Plate."
            exit 1
          fi
          KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          printf '%s' "$OLD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/old.keystore"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/old.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --next-signer --ks "$RUNNER_TEMP/plate.keystore" --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --lineage release/plate.lineage --rotation-min-sdk-version 28 \
            --out "$RUNNER_TEMP/rotated.apk" app/build/outputs/apk/release/app-release.apk
          mv "$RUNNER_TEMP/rotated.apk" app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/old.keystore"

      - name: Check it's signed with Plate's key
        if: steps.v.outputs.release == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          actual=$("$apksigner" verify --print-certs --min-sdk-version 28 app/build/outputs/apk/release/app-release.apk | grep -oP 'SHA-256 digest: \K[0-9a-f]+' | head -1)
          expected=$(tr -d ' \n' < release/signing-cert-sha256.txt)
          echo "Signed with $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The APK is not signed with Plate's release key (expected $expected). Nothing was published."
            exit 1
          fi

      - name: Publish the update
        if: steps.v.outputs.release == 'true'
        run: |
          python3 .github/scripts/publish_release.py "${{ steps.v.outputs.code }}" "${{ steps.v.outputs.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A release README.md
          git commit -m "Release Plate ${{ steps.v.outputs.name }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/plate.keystore" "$RUNNER_TEMP/old.keystore" local.properties
